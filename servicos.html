<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serviços | Illumine Hair Studio</title>
  <meta name="description" content="Todos os serviços do Illumine Hair Studio, em Juiz de Fora - MG. Filtre por tipo de serviço.">
  <meta name="theme-color" content="#2B1B18">

  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonte reserva dos títulos (usada enquanto os arquivos da Canela não estão em assets/fonts) -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/services.css">
  <link rel="stylesheet" href="css/catalog-page.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-catalog="services">

  <!-- CABEÇALHO -->
  <header class="header" id="header">
    <div class="container header__inner">
      <a href="index.html" class="header__logo" aria-label="Illumine Hair Studio - página inicial">
        <img src="assets/img/logo.png" alt="Logo Illumine Hair Studio">
      </a>

      <button class="header__toggle" id="menuToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu">
        <span></span><span></span><span></span>
      </button>

      <nav class="header__nav" id="menu" aria-label="Navegação principal">
        <ul>
          <li><a href="index.html#inicio">Início</a></li>
          <li><a href="index.html#sobre">Sobre</a></li>
          <li><a href="index.html#equipe">Equipe</a></li>
          <li><a href="servicos.html" class="is-active" aria-current="page">Serviços</a></li>
          <li><a href="produtos.html">Produtos</a></li>
          <li><a href="index.html#contato">Contato</a></li>
        </ul>
        <a href="index.html#contato" class="btn btn--small header__cta">Fale conosco</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="catalog">
      <div class="container">
        <header class="section__header">
          <span class="section__eyebrow">Illumine Hair Studio</span>
          <h1 class="section__title">Nossos serviços</h1>
          <p class="section__subtitle">Escolha um tipo de serviço para filtrar a lista.</p>
        </header>

        <div class="filter" id="catalogFilters" role="group" aria-label="Filtrar por tipo de serviço"></div>

        <div class="catalog__notice" id="catalogNotice" hidden></div>
        <p class="catalog__status" id="catalogStatus" role="status" aria-live="polite">Carregando serviços…</p>

        <div class="catalog__list" id="catalogList"></div>
      </div>
    </section>
  </main>

  <!-- RODAPÉ -->
  <footer class="footer">
    <div class="container footer__inner">
      <img class="footer__logo" src="assets/img/logo.png" alt="Illumine Hair Studio">
      <address class="footer__address">
        <span data-salon="address"></span><br>
        <a data-salon="phoneLink" href="#"></a>
      </address>
      <p class="footer__copy">&copy; <span id="year"></span> Illumine Hair Studio. Todos os direitos reservados.</p>
    </div>
  </footer>

  <!-- Botão flutuante do WhatsApp -->
  <a class="whatsapp-float" id="whatsappFloat" href="#" target="_blank" rel="noopener" aria-label="Chamar no WhatsApp">

  </a>

  <!-- Scripts (ordem importa: configuração e dados -> módulos -> página) -->
  <script src="js/config.js"></script>
  <script src="js/data/services-sample.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/catalog-ui.js"></script>
  <script src="js/catalog-page.js"></script>
</body>
</html>
